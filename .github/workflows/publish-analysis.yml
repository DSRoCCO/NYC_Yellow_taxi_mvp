name: Publish analysis to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "notebooks/analisis_integral_nyc_yellow_taxi.qmd"
      - "reports/**"
      - "data/raw/nyc_tlc_yellow_2019_2024/manifest.csv"
      - "data/raw/nyc_tlc_yellow_2019_2024/taxi_zone_lookup.csv"
      - "renv.lock"
      - ".github/workflows/publish-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Restore locked R packages
        run: Rscript -e 'install.packages("renv", repos = "https://cloud.r-project.org"); renv::restore(prompt = FALSE)'
      - name: Render frozen analysis for Pages
        run: quarto render notebooks/analisis_integral_nyc_yellow_taxi.qmd --to html --output-dir _site
      - name: Add Pages entry point
        run: |
          analysis_file="$(find _site -name 'analisis_integral_nyc_yellow_taxi.html' -type f -print -quit)"
          test -n "$analysis_file"
          analysis_path="${analysis_file#_site/}"
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=%s">' "$analysis_path" > _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
